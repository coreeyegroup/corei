apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Chart.Name }}
  namespace: platform

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Chart.Name }}

  template:

    metadata:
      labels:
        app: {{ .Chart.Name }}

    spec:

      serviceAccountName: platform-runtime

      containers:

      - name: {{ .Chart.Name }}

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
