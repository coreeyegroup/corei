spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kafka
  serviceName: kafka-headless
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-05-26T13:29:09Z"
      creationTimestamp: null
      labels:
        app: kafka
    spec:
      containers:
      - args:
        - |
          cat <<KAFKAEOF > /tmp/server.properties
          node.id=0

          process.roles=broker,controller

          controller.quorum.voters=0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093

          listeners=PLAINTEXT://0.0.0.0:9092,SASL_SSL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093

          advertised.listeners=PLAINTEXT://kafka.kafka.svc.cluster.local:9092,SASL_SSL://kafka.kafka.svc.cluster.local:9094

          listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT

          controller.listener.names=CONTROLLER

          inter.broker.listener.name=PLAINTEXT

          log.dirs=/var/lib/kafka/data/logs

          offsets.topic.replication.factor=1

          transaction.state.log.replication.factor=1

          transaction.state.log.min.isr=1
          sasl.enabled.mechanisms=SCRAM-SHA-256

          listener.name.sasl_ssl.sasl.enabled.mechanisms=SCRAM-SHA-256

          listener.name.sasl_ssl.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

          ssl.keystore.location=/etc/kafka/tls/keystore.jks

          ssl.truststore.location=/etc/kafka/tls/truststore.jks
          KAFKAEOF

          /opt/kafka/bin/kafka-storage.sh format \
            --ignore-formatted \
            --cluster-id $CLUSTER_ID \
            --config /tmp/server.properties

          exec /opt/kafka/bin/kafka-server-start.sh \
            /tmp/server.properties
        command:
        - /bin/bash
        - -c
        env:
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: KAFKA_OPTS
          value: -Djava.security.auth.login.config=/etc/kafka/security/kafka_jaas.conf
        image: apache/kafka:3.7.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 9092
          timeoutSeconds: 1
        name: kafka
        ports:
        - containerPort: 9092
          name: broker
          protocol: TCP
        - containerPort: 9093
          name: controller
          protocol: TCP
        - containerPort: 9094
          name: sasl-ssl
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 9092
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/kafka/data
          name: kafka-data
        - mountPath: /etc/kafka/tls
          name: kafka-runtime-tls
          readOnly: true
        - mountPath: /etc/kafka/security
          name: kafka-security-runtime
          readOnly: true
