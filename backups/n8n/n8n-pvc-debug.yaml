apiVersion: v1
kind: Pod

metadata:
  name: n8n-pvc-debug
  namespace: n8n

spec:

  restartPolicy: Never

  containers:

  - name: debug

    image: busybox

    command:
      - sleep
      - "3600"

    volumeMounts:

    - name: n8n-storage
      mountPath: /data

  volumes:

  - name: n8n-storage

    persistentVolumeClaim:
      claimName: n8n-data
