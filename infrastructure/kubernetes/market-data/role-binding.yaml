apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: market-data-role-binding
  namespace: market-data

subjects:
  - kind: ServiceAccount
    name: market-data-service-account
    namespace: market-data

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: market-data-role
