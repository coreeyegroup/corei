apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis
  namespace: storage

spec:
  serviceName: redis

  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: redis:7.2

          imagePullPolicy: IfNotPresent

          command:
            - redis-server

          args:
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: redis-storage

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: longhorn

        resources:
          requests:
            storage: 5Gi
