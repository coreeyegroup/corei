apiVersion: apps/v1
kind: Deployment

metadata:
  name: feature-store-service
  namespace: market-data

spec:
  replicas: 1

  selector:
    matchLabels:
      app: feature-store-service

  template:
    metadata:
      labels:
        app: feature-store-service

    spec:
      containers:
        - name: feature-store-service

          image: feature-store-service:stage-12

          imagePullPolicy: Never

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"
