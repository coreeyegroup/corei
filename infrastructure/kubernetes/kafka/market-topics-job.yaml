apiVersion: batch/v1
kind: Job

metadata:
  name: create-market-topics
  namespace: kafka

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: kafka-topic-init

          image: confluentinc/cp-kafka:7.6.0

          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              kafka-topics \
              --bootstrap-server kafka-broker-0.kafka.kafka.svc.cluster.local:9092 \
              --create \
              --if-not-exists \
              --topic market_ticks \
              --partitions 3 \
              --replication-factor 1

              kafka-topics \
              --bootstrap-server kafka-broker-0.kafka.kafka.svc.cluster.local:9092 \
              --create \
              --if-not-exists \
              --topic market_ohlcv \
              --partitions 3 \
              --replication-factor 1

              kafka-topics \
              --bootstrap-server kafka-broker-0.kafka.kafka.svc.cluster.local:9092 \
              --list
