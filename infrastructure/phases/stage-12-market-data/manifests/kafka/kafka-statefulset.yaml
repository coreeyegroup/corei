apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: kafka

spec:
  serviceName: kafka-headless

  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000

      initContainers:
        - name: volume-permissions

          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/kafka/data/logs

              chown -R 1000:1000 /var/lib/kafka/data/logs

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

      containers:
        - name: kafka

          image: apache/kafka:3.7.1

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - containerPort: 9092
              name: broker

            - containerPort: 9093
              name: controller

          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

          command:
            - /bin/bash
            - -c

          args:
            - |
              cat <<KAFKAEOF > /tmp/server.properties
              node.id=0

              process.roles=broker,controller

              controller.quorum.voters=0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093

              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

              advertised.listeners=PLAINTEXT://kafka.kafka.svc.cluster.local:9092

              listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

              controller.listener.names=CONTROLLER

              inter.broker.listener.name=PLAINTEXT

              log.dirs=/var/lib/kafka/data/logs

              offsets.topic.replication.factor=1

              transaction.state.log.replication.factor=1

              transaction.state.log.min.isr=1
              KAFKAEOF

              /opt/kafka/bin/kafka-storage.sh format \
                --ignore-formatted \
                --cluster-id $CLUSTER_ID \
                --config /tmp/server.properties

              exec /opt/kafka/bin/kafka-server-start.sh \
                /tmp/server.properties

          readinessProbe:
            tcpSocket:
              port: 9092

            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9092

            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "1000m"
              memory: "2Gi"

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 20Gi
