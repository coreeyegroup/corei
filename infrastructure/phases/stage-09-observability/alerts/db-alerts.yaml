apiVersion: monitoring.coreos.com/v1

kind: PrometheusRule

metadata:
  name: db-alerts
  namespace: observability

spec:
  groups:

    - name: db-alerts

      rules:

        - alert: DatabaseReplicationLag

          expr: pg_replication_lag > 30

          for: 2m

          labels:
            severity: critical

          annotations:
            summary: Database replication lag critical

            description: PostgreSQL replication lag exceeded 30 seconds.

        - alert: DatabaseConnectionPoolExhausted

          expr: pg_stat_activity_count > 90

          for: 5m

          labels:
            severity: warning

          annotations:
            summary: Database connection pool exhaustion risk

            description: PostgreSQL active connections exceeded safe threshold.
