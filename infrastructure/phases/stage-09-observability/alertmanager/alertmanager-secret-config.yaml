apiVersion: v1
kind: Secret

metadata:
  name: alertmanager-custom-config
  namespace: observability

stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: telegram-warning

      routes:

        - matchers:
            - severity="critical"

          receiver: telegram-critical
          continue: true

        - matchers:
            - severity="warning"

          receiver: telegram-warning

    receivers:

      - name: telegram-critical

        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id: YOUR_CHAT_ID

            parse_mode: Markdown

            message: |
              🚨 CRITICAL ALERT 🚨
              Alert: {{ .CommonLabels.alertname }}
              Severity: {{ .CommonLabels.severity }}

              Summary:
              {{ .CommonAnnotations.summary }}

            send_resolved: true

      - name: telegram-warning

        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id: YOUR_CHAT_ID

            parse_mode: Markdown

            message: |
              ⚠️ WARNING ALERT ⚠️
              Alert: {{ .CommonLabels.alertname }}
              Severity: {{ .CommonLabels.severity }}

              Summary:
              {{ .CommonAnnotations.summary }}

            send_resolved: true
