apiVersion: apps/v1
kind: Deployment

metadata:
  name: penpot-postgres
  namespace: tools

spec:
  replicas: 1

  selector:
    matchLabels:
      app: penpot-postgres

  template:
    metadata:
      labels:
        app: penpot-postgres

    spec:
      containers:

      - name: postgres

        image: postgres:16

        envFrom:
        - secretRef:
            name: penpot-postgres-secret

        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        ports:
        - containerPort: 5432

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: penpot-postgres-pvc
