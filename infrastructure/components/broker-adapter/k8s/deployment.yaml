apiVersion: apps/v1
kind: Deployment

metadata:
  name: broker-adapter-service
  namespace: trading-infra

spec:
  replicas: 1

  selector:
    matchLabels:
      app: broker-adapter-service

  template:
    metadata:
      labels:
        app: broker-adapter-service

    spec:
      containers:

        - name: broker-adapter-service

          image: broker-adapter:stage-16

          imagePullPolicy: Never

          ports:
            - containerPort: 8003

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
