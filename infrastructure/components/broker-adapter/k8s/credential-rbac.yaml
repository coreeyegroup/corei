apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-adapter
  namespace: trading-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-adapter-credentials
  namespace: trading-infra
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-adapter-credentials
  namespace: trading-infra
subjects:
  - kind: ServiceAccount
    name: broker-adapter
    namespace: trading-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: broker-adapter-credentials
