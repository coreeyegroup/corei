apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-runtime-role
  namespace: cicd
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
