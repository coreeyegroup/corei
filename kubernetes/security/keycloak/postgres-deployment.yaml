apiVersion: apps/v1
kind: Deployment

metadata:
  name: keycloak-postgres
  namespace: auth

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak-postgres

  template:
    metadata:
      labels:
        app: keycloak-postgres

    spec:
      containers:
        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: keycloak-postgres-secret
