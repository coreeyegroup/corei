apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-root-app
  namespace: cicd

spec:
  project: core-system

  source:
    repoURL: git@github.com:coreeyegroup/corei.git
    targetRevision: main
    path: argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: cicd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
